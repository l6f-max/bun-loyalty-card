<style>
  :root{
    --kraft:#E7D9BE; --kraftDark:#CBB68C; --paper:#F3EAD6;
    --espresso:#2C1D14; --ink:#9C3B2A; --gold:#B4841F;
    --textDark:#2B1D14; --textMuted:#7A6A52;
    --radius-lg:26px; --radius-md:16px; --radius-sm:12px;
    --shadow-soft:0 10px 28px rgba(43,29,20,.08);
    --shadow-pop:0 16px 34px rgba(0,0,0,.18);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--kraft);font-family:'Tajawal','Segoe UI',Tahoma,system-ui,sans-serif;color:var(--textDark);-webkit-font-smoothing:antialiased;}
  #app{max-width:430px;margin:0 auto;padding-bottom:48px;}
  .header{background:var(--espresso);color:var(--kraft);padding:26px 22px 30px;position:relative;border-radius:0 0 28px 28px;box-shadow:var(--shadow-pop);}
  .header .title{display:flex;align-items:center;gap:8px;font-size:19px;font-weight:800;letter-spacing:.2px;}
  .header .tag{font-size:12px;opacity:.65;margin-top:2px;}
  .perf{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-around;transform:translateY(50%);}
  .perf span{width:9px;height:9px;border-radius:50%;background:var(--kraft);display:block;box-shadow:0 2px 3px rgba(0,0,0,.12);}
  .section{padding:24px 18px 18px;display:flex;flex-direction:column;gap:16px;}
  .card{background:#fff;border:1px solid rgba(203,182,140,.35);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow-soft);}
  .row{display:flex;gap:8px;}
  .stats{display:flex;gap:8px;flex-wrap:wrap;}
  .stat{flex:1;min-width:120px;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid rgba(203,182,140,.35);border-radius:var(--radius-md);padding:12px 14px;box-shadow:var(--shadow-soft);}
  .stat .ic{background:var(--espresso);color:var(--kraft);border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
  .stat .val{font-size:18px;font-weight:800;}
  .stat .lbl{font-size:11px;color:var(--textMuted);}
  input[type=text],input[type=tel]{border:1.5px solid var(--kraftDark);background:#fff;border-radius:var(--radius-sm);padding:11px 14px;font-size:14px;outline:none;font-family:inherit;transition:border-color .15s;}
  input[type=text]:focus,input[type=tel]:focus{border-color:var(--ink);}
  button{font-family:inherit;cursor:pointer;border:none;transition:transform .12s ease;}
  button:active{transform:scale(.97);}
  button:disabled{opacity:.5;cursor:not-allowed;}
  .btn-dark{background:var(--espresso);color:var(--kraft);border-radius:var(--radius-sm);padding:13px 16px;font-size:14px;font-weight:700;box-shadow:0 8px 18px rgba(43,29,20,.2);}
  .btn-ink{background:var(--ink);color:#fff;border-radius:var(--radius-sm);padding:10px 16px;font-size:13px;font-weight:700;}
  .btn-gold{background:var(--gold);color:#fff;border-radius:var(--radius-sm);padding:9px 14px;font-size:12px;font-weight:700;}
  .btn-outline{background:#fff;color:var(--ink);border:1.5px solid var(--kraftDark);border-radius:var(--radius-sm);padding:8px 12px;font-size:13px;font-weight:700;}
  .badge-pill{display:inline-flex;align-items:center;gap:6px;background:var(--kraft);color:var(--gold);border:1px solid var(--kraftDark);border-radius:999px;padding:6px 16px;font-size:12.5px;font-weight:700;}
  .progress-track{width:100%;height:8px;border-radius:999px;background:var(--kraft);overflow:hidden;margin-bottom:14px;}
  .progress-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--ink),var(--gold));transition:width .5s ease;}
  .stampgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;}
  .slot{position:relative;aspect-ratio:1;border-radius:50%;border:2px dashed var(--kraftDark);background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--kraftDark);font-weight:700;}
  .stamp{width:82%;height:82%;border-radius:50%;background:linear-gradient(145deg,var(--ink),var(--gold));display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;box-shadow:0 4px 10px rgba(0,0,0,.22), 0 0 0 3px #fff inset;}
  .stamp.new{animation:slam .5s cubic-bezier(.34,1.56,.64,1);}
  @keyframes slam{0%{transform:scale(1.8);opacity:0;}60%{transform:scale(.95);opacity:1;}100%{transform:scale(1);opacity:1;}}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--espresso);color:var(--kraft);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:700;box-shadow:0 10px 26px rgba(0,0,0,.28);z-index:50;}
  .qrbox{background:#fff;border-radius:var(--radius-md);padding:16px;display:inline-flex;box-shadow:var(--shadow-soft);}
  .qrbox svg{display:block;}
  .center{text-align:center;}
  .muted{color:var(--textMuted);font-size:12px;}
  .code-pill{font-family:ui-monospace,monospace;letter-spacing:3px;background:var(--kraft);color:var(--espresso);padding:6px 16px;border-radius:999px;font-size:13px;font-weight:700;}
  .link-btn{background:none;border:none;text-decoration:underline;font-size:12px;color:var(--textMuted);padding:0;}
  label.chk{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--textMuted);justify-content:center;}
  .loading{padding:40px 20px;text-align:center;color:var(--textMuted);}
  .reward-ready{margin-top:14px;text-align:center;font-weight:800;background:linear-gradient(135deg,var(--gold),var(--ink));color:#fff;border-radius:var(--radius-md);padding:13px;box-shadow:0 8px 20px rgba(180,132,31,.3);}
  .wallet-card{background:var(--paper);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-pop);margin-bottom:0;}
  .wtop{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;}
  .wlogo{width:44px;height:44px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 2px 6px rgba(0,0,0,.12);overflow:hidden;flex-shrink:0;}
  .wbrand{font-weight:800;font-size:13px;letter-spacing:.3px;color:var(--textDark);opacity:.8;}
  .wrefresh{background:none;border:none;font-size:14px;opacity:.55;padding:2px;}
  .wstrip{background:var(--espresso);padding:22px 16px;display:grid;grid-template-columns:repeat(5,1fr);gap:12px;}
  .wicon{aspect-ratio:1;display:flex;align-items:center;justify-content:center;}
  .wicon .fill{width:100%;height:100%;max-width:46px;max-height:46px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 3px 10px rgba(0,0,0,.2);}
  .wicon .empty{font-size:20px;opacity:.3;filter:grayscale(1) brightness(2);}
  .wgreet{display:flex;justify-content:space-between;align-items:flex-start;padding:18px;}
  .wname{font-size:13px;color:var(--textMuted);}
  .wname b{display:block;font-size:19px;color:var(--textDark);font-weight:800;margin-top:2px;}
  .wremain{text-align:left;}
  .wremain span{font-size:12px;color:var(--textMuted);display:block;}
  .wremain b{font-size:28px;color:var(--espresso);font-weight:900;}
  .wqrsec{background:#fff;border-radius:var(--radius-lg);padding:20px;text-align:center;box-shadow:var(--shadow-soft);margin-top:16px;}
</style>
